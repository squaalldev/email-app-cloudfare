name = "email-app-api"
main = "src/index.ts"
compatibility_date = "2026-04-22"

[[kv_namespaces]]
binding = "CHAT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
GEMINI_MODEL = "google/gemini-2.5-flash"

# Set via `wrangler secret put`:
# GOOGLE_API_KEY
# CF_AIG_TOKEN (optional)
# CF_ACCOUNT_ID (or move to [vars])
# CF_GATEWAY_ID (or move to [vars])
